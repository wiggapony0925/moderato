name: Deploy docs

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time; never cancel one midway, or Pages is left serving a
# half-uploaded site.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The docs import the real built package — build it first or the site
      # has nothing to resolve `moderato` to.
      - run: npm run build
      - run: npm ci --prefix docs
      - run: npm --prefix docs run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

# nginx for the moderato docs on Cloud Run.
#
# A fully static site — no API, no proxy, nothing to authenticate. So this file
# is only three jobs: serve the files, cache the fingerprinted ones hard and the
# HTML not at all, and refuse to be embeddable or sniffable.

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # ── Security headers ──
  # The site is static and self-contained: no inline scripts survive the build,
  # no third-party origins are contacted, nothing is fetched at runtime. The
  # policy can therefore be genuinely tight rather than aspirational.
  #
  # `style-src` carries 'unsafe-inline' only because Docusaurus inlines the
  # theme bootstrap's critical CSS; scripts have no such exemption.
  set $csp "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests";
  add_header Content-Security-Policy $csp always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  # Cloud Run terminates TLS in front of us, so HSTS is safe to assert here.
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml application/x-ndjson;
  gzip_vary on;

  # Fingerprinted assets: the name changes when the bytes do, so they can be
  # cached forever.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }
  location ~* \.(?:svg|png|ico|woff2?)$ {
    add_header Cache-Control "public, max-age=604800" always;
    try_files $uri =404;
  }

  # The rehearsal report is data, not an asset — it changes with every release
  # and a stale copy would show numbers for a version nobody is running.
  location /rehearsal/ {
    add_header Cache-Control "public, max-age=300, must-revalidate" always;
    try_files $uri =404;
  }

  # HTML is never cached: a docs page that lags a deploy is the exact failure
  # this whole site is built to avoid.
  location / {
    add_header Cache-Control "no-cache" always;
    # Docusaurus emits a real file per route (trailingSlash: false), so a miss
    # is a genuine 404 rather than a client-routed page.
    try_files $uri $uri.html $uri/index.html /404.html;
  }

  error_page 404 /404.html;
}
